<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Daily secretary">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="255" y2="255" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22262E"/>
      <stop offset="1" stop-color="#12141A"/>
    </linearGradient>
    <linearGradient id="disc" x1="70" y1="58" x2="186" y2="192" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4ADE80"/>
      <stop offset="1" stop-color="#22A34E"/>
    </linearGradient>
    <radialGradient id="halo" cx="128" cy="120" r="96" gradientUnits="userSpaceOnUse">
      <stop offset="0.55" stop-color="#34C759" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#34C759" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="256" height="256" rx="56" fill="url(#tile)"/>
  <circle cx="128" cy="120" r="96" fill="url(#halo)"/>

  <!-- the recording dot -->
  <circle cx="128" cy="120" r="62" fill="url(#disc)"/>
  <circle cx="128" cy="120" r="62" fill="none" stroke="#7BE79C" stroke-opacity="0.55" stroke-width="3"/>
  <circle cx="128" cy="120" r="15" fill="#F7FFF9"/>

  <!-- the paused badge, same amber as the widget -->
  <g>
    <circle cx="186" cy="182" r="34" fill="#15171B"/>
    <circle cx="186" cy="182" r="31" fill="#F2BE22"/>
    <rect x="175" y="170" width="7" height="24" rx="2.5" fill="#15171B"/>
    <rect x="190" y="170" width="7" height="24" rx="2.5" fill="#15171B"/>
  </g>

  <!-- one diary rule: the separator the record uses -->
  <g stroke="#8A8F98" stroke-opacity="0.55" stroke-width="4" stroke-linecap="round">
    <line x1="62" y1="216" x2="122" y2="216"/>
    <line x1="134" y1="216" x2="194" y2="216"/>
  </g>
</svg>
